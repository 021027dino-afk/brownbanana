<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Syne';font-weight:800;src:url(fonts/Syne-800.ttf)}
@font-face{font-family:'NotoKR';font-weight:600;src:url(fonts/NotoSansKR-600.ttf)}
@font-face{font-family:'NotoKR';font-weight:700;src:url(fonts/NotoSansKR-700.ttf)}
html,body{margin:0;background:#050607}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ---------------------------------------------------------------------------
// DURIT 30s spot — frame-exact previz renderer. render(t) draws time t (s).
// ---------------------------------------------------------------------------
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');

const C = {
  silver:'#B9BDC2', gun:'#2E3134', green:'#8FE02A', gold:'#D6B05A', black:'#050607',
  blueDeep:'#071C4A', blueDark:'#020817', wave:'#4A95FF',
  redDeep:'#3C0710', redDark:'#140205', line:'#FF3A46'
};

// ---- easing / helpers (ease-out only, no overshoot) ----
const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp = (a,b,u)=>a+(b-a)*u;
const eo = u=>1-Math.pow(1-clamp(u),3);           // easeOutCubic
const eo2 = u=>1-Math.pow(1-clamp(u),2);          // easeOutQuad
const eio = u=>{u=clamp(u);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const seg = (t,a,b)=>clamp((t-a)/(b-a));
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function mix(h1,h2,u){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);
  const r=Math.round(lerp(a>>16&255,b>>16&255,u)),g=Math.round(lerp(a>>8&255,b>>8&255,u)),bl=Math.round(lerp(a&255,b&255,u));
  return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);}

// deterministic noise texture (sandblast / skin grain)
function makeNoise(size,amp){const n=document.createElement('canvas');n.width=n.height=size;const g=n.getContext('2d');
  const d=g.createImageData(size,size);let s=1234567;const r=()=>((s=(s*16807)%2147483647)/2147483647);
  for(let i=0;i<d.data.length;i+=4){const v=128+(r()-.5)*amp;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  g.putImageData(d,0,0);return n;}
const noiseFine = makeNoise(256,90), noiseSkin = makeNoise(512,60);
let patFine, patSkin;

// ---------------------------------------------------------------------------
// WORLD ENVIRONMENTS
// ---------------------------------------------------------------------------
const ENV = {
  studio:{rim:C.gold, rim2:C.green, tint:null, tintA:0, key:1.0},
  blue:{rim:C.wave, rim2:'#9cc4ff', tint:C.blueDeep, tintA:.38, key:.85},
  red:{rim:C.line, rim2:'#ff8a90', tint:C.redDeep, tintA:.40, key:.85},
};
function envMix(a,b,u){return {rim:mix(a.rim,b.rim,u),rim2:mix(a.rim2,b.rim2,u),
  tint:mix(a.tint||'#000000',b.tint||'#000000',u),tintA:lerp(a.tintA,b.tintA,u),key:lerp(a.key,b.key,u)};}

function bgSpace(g,deep,dark,cx=540,cy=900,k=1){
  g.fillStyle=dark;g.fillRect(0,0,W,H);
  const r=g.createRadialGradient(cx,cy,0,cx,cy,1300*k);
  r.addColorStop(0,deep);r.addColorStop(1,dark);g.fillStyle=r;g.fillRect(0,0,W,H);
}

// ---------------------------------------------------------------------------
// DEVICE (units: mm, origin = centre of hexagonal end, y up = negative)
// ---------------------------------------------------------------------------
const DEV = {W:28,D:24,hB:105,hG:58,neck:62,headR:20};
function headPos(theta){const c=Math.cos(theta);return {x:DEV.neck*0.866*c,y:-DEV.hB-DEV.neck*0.5};}

function metalGrad(g,x0,x1,stops){const gr=g.createLinearGradient(x0,0,x1,0);stops.forEach(([o,c])=>gr.addColorStop(o,c));return gr;}
const SILVER=[[0,'#25282b'],[.18,'#6e7378'],[.42,'#B9BDC2'],[.55,'#e4e6e8'],[.72,'#9a9fa5'],[1,'#2E3134']];
const GREEN=[[0,'#2c4d06'],[.22,'#6fb51c'],[.48,'#8FE02A'],[.6,'#a9f055'],[.8,'#78c21f'],[1,'#253f05']];

function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function drawHeadFace(g,hx,hy,rx,ry,o){
  // concentric rings: 24K gold outer, matte SUS304 steel, gold centre button
  const lit=o.ringLight||[0,0,0], tint=o.headTint;
  g.save();g.translate(hx,hy);g.scale(rx/DEV.headR,ry/DEV.headR);
  const R=DEV.headR;
  // outer gold ring (brushed: conic)
  let cg=g.createConicGradient(-0.6,0,0);
  [[0,'#8a6a2a'],[.12,'#f2d58e'],[.25,'#b38a3c'],[.4,'#e9c873'],[.55,'#7d5f24'],[.7,'#f6dc9a'],[.85,'#a97f35'],[1,'#8a6a2a']].forEach(([a,c])=>cg.addColorStop(a,c));
  g.beginPath();g.arc(0,0,R,0,7);g.fillStyle=cg;g.fill();
  // bevel shading
  let rg=g.createRadialGradient(-R*.3,-R*.35,R*.2,0,0,R);rg.addColorStop(0,'rgba(255,240,200,.25)');rg.addColorStop(.75,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,.45)');
  g.fillStyle=rg;g.fill();
  // gap
  g.beginPath();g.arc(0,0,14.6,0,7);g.fillStyle='#1b1a17';g.fill();
  // steel ring (matte)
  cg=g.createConicGradient(0.4,0,0);
  [[0,'#6c7176'],[.2,'#a3a8ad'],[.45,'#5f6468'],[.7,'#9ba0a5'],[1,'#6c7176']].forEach(([a,c])=>cg.addColorStop(a,c));
  g.beginPath();g.arc(0,0,14.1,0,7);g.fillStyle=cg;g.fill();
  g.save();g.globalAlpha=.18;g.globalCompositeOperation='overlay';g.fillStyle=patFine;g.fill();g.restore();
  g.beginPath();g.arc(0,0,8.6,0,7);g.fillStyle='#16150f';g.fill();
  // centre button gold dome
  rg=g.createRadialGradient(-2.4,-2.8,.4,0,0,8.1);rg.addColorStop(0,'#fff3c8');rg.addColorStop(.35,'#e6c274');rg.addColorStop(.8,'#a07a30');rg.addColorStop(1,'#5f4719');
  g.beginPath();g.arc(0,0,8.1,0,7);g.fillStyle=rg;g.fill();
  // world tint
  if(tint){g.beginPath();g.arc(0,0,R,0,7);g.globalCompositeOperation='multiply';g.fillStyle=tint;g.fill();g.globalCompositeOperation='source-over';}
  // ring-by-ring light (cut 1)
  g.globalCompositeOperation='lighter';
  const ringDefs=[[0,8.1,lit[0]],[8.6,14.1,lit[1]],[14.6,R,lit[2]]];
  ringDefs.forEach(([a,b,v])=>{if(v<=0)return;g.beginPath();g.arc(0,0,b,0,7);if(a>0)g.arc(0,0,a,Math.PI*2,0,true);
    g.fillStyle=`rgba(255,226,150,${.2*v})`;g.fill();
    g.beginPath();g.arc(0,0,b-.25,0,7);g.strokeStyle=`rgba(255,245,215,${.9*v})`;g.lineWidth=.35;g.stroke();});
  if(o.headGlow){g.beginPath();g.arc(0,0,R,0,7);g.fillStyle=hexA(o.headGlowColor||C.gold,o.headGlow*.35);g.fill();}
  g.restore();
}

function drawDeviceLocal(g,o){
  const th=o.theta||0, c=Math.cos(th), s=Math.sin(th), ac=Math.abs(c), as=Math.abs(s);
  const pw=DEV.W*ac+DEV.D*as, hw=pw/2;
  const fx=(DEV.D/2)*s*0.0; // front face centre offset (kept centred; compression via c)
  // --- lower green handle with faceted hexagonal end
  g.save();
  rrect(g,-hw,-DEV.hG-2,pw,DEV.hG-6,8);g.fillStyle=metalGrad(g,-hw,hw,GREEN);g.fill();
  // soft-touch matte: knock down specular with flat overlay
  g.fillStyle='rgba(60,110,10,.18)';g.fill();
  // faceted hex end
  g.beginPath();g.moveTo(-hw,-10);g.lineTo(hw,-10);g.lineTo(hw*.82,-1.2);g.lineTo(hw*.5,0);g.lineTo(-hw*.5,0);g.lineTo(-hw*.82,-1.2);g.closePath();
  g.fillStyle=metalGrad(g,-hw,hw,[[0,'#1c3304'],[.3,'#4f8a12'],[.5,'#7cc824'],[.7,'#4f8a12'],[1,'#162903']]);g.fill();
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=.35;
  [[-hw*.5,0,-hw*.62,-10],[hw*.5,0,hw*.62,-10],[-hw*.82,-1.2,-hw,-10],[hw*.82,-1.2,hw,-10]].forEach(([a,b,cx,d])=>{g.beginPath();g.moveTo(a,b);g.lineTo(cx,d);g.stroke();});
  g.beginPath();g.moveTo(-hw,-10);g.lineTo(hw,-10);g.strokeStyle='rgba(200,255,140,.35)';g.stroke();
  // seam
  g.fillStyle='#16191b';g.fillRect(-hw,-DEV.hG-2.6,pw,1.4);
  // --- silver upper body
  rrect(g,-hw,-DEV.hB-4,pw,DEV.hB-DEV.hG+2,9);g.fillStyle=metalGrad(g,-hw,hw,SILVER);g.fill();
  g.save();g.clip();g.globalAlpha=.22;g.globalCompositeOperation='overlay';g.fillStyle=patFine;g.fillRect(-hw,-DEV.hB-4,pw,60);g.restore();
  // neck (120° bend) -> head
  const hp=headPos(th);const bx=0,by=-DEV.hB+4;
  const dx=hp.x-bx,dy=hp.y-by,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  const w0=hw*.98,w1=Math.max(9,11*ac+9*as);
  g.beginPath();g.moveTo(bx+nx*w0,by+ny*w0);g.lineTo(hp.x+nx*w1,hp.y+ny*w1);g.lineTo(hp.x-nx*w1,hp.y-ny*w1);g.lineTo(bx-nx*w0,by-ny*w0);g.closePath();
  const ng=g.createLinearGradient(bx+nx*w0,by+ny*w0,bx-nx*w0,by-ny*w0);SILVER.forEach(([a,cc])=>ng.addColorStop(a,cc));
  g.fillStyle=ng;g.fill();
  g.beginPath();g.arc(bx,by,w0,0,7);g.fillStyle=metalGrad(g,-hw,hw,SILVER);g.fill();
  // side logo "duflow" (small, on the side of the neck)
  if(as>.35){g.save();g.translate((bx+hp.x)/2,(by+hp.y)/2+1);g.rotate(Math.atan2(dy,dx));g.scale(1,1);
    g.font='800 3.2px Syne';g.textAlign='center';g.textBaseline='middle';g.fillStyle=`rgba(40,44,48,${(as-.35)*1.4})`;g.fillText('duflow',0,0);g.restore();}
  // head: thickness band then face
  const rx=Math.max(DEV.headR*ac,2.2), band=6*as;
  g.beginPath();g.ellipse(hp.x+band*Math.sign(-c||1)*.5,hp.y,rx+band*.5,DEV.headR,0,0,7);
  g.fillStyle=metalGrad(g,hp.x-rx-band,hp.x+rx+band,[[0,'#3a2d12'],[.5,'#b8924a'],[1,'#3a2d12']]);g.fill();
  if(c>0) drawHeadFace(g,hp.x,hp.y,rx,DEV.headR,o);
  else{g.beginPath();g.ellipse(hp.x,hp.y,rx,DEV.headR,0,0,7);g.fillStyle=metalGrad(g,hp.x-rx,hp.x+rx,SILVER);g.fill();}
  // --- front panel: 3 LEDs in a row, 3 round buttons stacked (power, up, down)
  if(c>.18){
    const k=clamp((c-.18)/.4);
    g.save();g.globalAlpha=k;g.translate(fx,0);g.scale(c,1);
    const ledY=-99, leds=o.leds||[0,0,0], lc=o.ledColor||C.wave;
    [-6,0,6].forEach((lx,i)=>{
      g.beginPath();g.arc(lx,ledY,1.7,0,7);g.fillStyle='#121416';g.fill();
      g.beginPath();g.arc(lx,ledY,1.15,0,7);g.fillStyle='#2a2d30';g.fill();
      const v=leds[i];if(v>0){
        g.save();g.globalCompositeOperation='lighter';
        const lg=g.createRadialGradient(lx,ledY,0,lx,ledY,6*v+1);lg.addColorStop(0,hexA(lc,.9*v));lg.addColorStop(1,hexA(lc,0));
        g.fillStyle=lg;g.beginPath();g.arc(lx,ledY,6*v+1,0,7);g.fill();
        g.beginPath();g.arc(lx,ledY,1.45,0,7);g.fillStyle=hexA(lc,v);g.fill();g.beginPath();g.arc(lx,ledY,.8,0,7);g.fillStyle=`rgba(255,255,255,${.9*v})`;g.fill();
        g.restore();}
    });
    const press=o.press||0;
    [[-89,'pwr'],[-80,'up'],[-71,'dn']].forEach(([by2,kind],i)=>{
      const p=i===0?press:0;
      g.beginPath();g.arc(0,by2,3.6,0,7);g.fillStyle='#15171a';g.fill();
      const bg=g.createRadialGradient(-1.1,by2-1.3-p*.3,.2,0,by2,3.1);bg.addColorStop(0,'#eef0f2');bg.addColorStop(.6,'#9ea3a8');bg.addColorStop(1,'#4a4e52');
      g.beginPath();g.arc(0,by2+p*.25,3.05-p*.15,0,7);g.fillStyle=bg;g.fill();
      g.strokeStyle='rgba(30,33,36,.85)';g.lineWidth=.32;g.lineCap='round';g.beginPath();
      if(kind==='pwr'){g.arc(0,by2+p*.25,1.25,-Math.PI*.3-Math.PI/2+Math.PI,Math.PI*.3-Math.PI/2+Math.PI*2-Math.PI);g.stroke();g.beginPath();g.moveTo(0,by2-1.6+p*.25);g.lineTo(0,by2-.3+p*.25);g.stroke();}
      if(kind==='up'){g.moveTo(-1,by2);g.lineTo(1,by2);g.moveTo(0,by2-1);g.lineTo(0,by2+1);g.stroke();}
      if(kind==='dn'){g.moveTo(-1,by2);g.lineTo(1,by2);g.stroke();}
    });
    g.restore();
  }
  g.restore();
}

// Draws device onto main ctx with world lighting and optional mirror reflection.
function drawDevice(o){
  octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,W,H);
  octx.save();octx.translate(o.x,o.y);octx.rotate(o.roll||0);octx.scale(o.s,o.s);
  drawDeviceLocal(octx,o);
  if(o.hand) drawHandFront(octx,o);
  octx.restore();
  const env=o.env||ENV.studio;
  // world tint (device lit by whichever world is on screen)
  octx.save();octx.globalCompositeOperation='source-atop';
  if(env.tint&&env.tintA>0){octx.globalAlpha=env.tintA;octx.fillStyle=env.tint;octx.fillRect(0,0,W,H);octx.globalAlpha=1;}
  // rim light from the right + secondary from the left
  octx.globalCompositeOperation='source-atop';
  const rx=o.x+(o.s*40), lg=octx.createLinearGradient(o.x-o.s*30,0,o.x+o.s*40,0);
  lg.addColorStop(0,hexA(env.rim2,.18));lg.addColorStop(.45,'rgba(0,0,0,0)');lg.addColorStop(.85,'rgba(0,0,0,0)');lg.addColorStop(1,hexA(env.rim,.45));
  octx.globalCompositeOperation='lighter';octx.globalAlpha=1;
  octx.fillStyle=lg;octx.save();octx.globalCompositeOperation='source-atop';octx.fillRect(0,0,W,H);octx.restore();
  octx.restore();
  if(o.hand){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.roll||0);ctx.scale(o.s,o.s);drawHandLocal(ctx,o);ctx.restore();}
  if(o.reflect){
    ctx.save();ctx.globalAlpha=o.reflect;ctx.translate(0,o.y*2);ctx.scale(1,-1);ctx.drawImage(off,0,0);ctx.restore();
    // fade reflection into the black glossy floor
    const fg=ctx.createLinearGradient(0,o.y,0,o.y+o.s*70);fg.addColorStop(0,'rgba(5,6,7,.35)');fg.addColorStop(1,o.floor||C.black);
    ctx.fillStyle=fg;ctx.fillRect(0,o.y,W,H-o.y);
  }
  if(o.shadow){ctx.save();ctx.shadowColor=o.shadow;ctx.shadowBlur=60;ctx.drawImage(off,0,0);ctx.restore();}
  else ctx.drawImage(off,0,0);
}

function drawHandLocal(g,o){
  // palm/wrist behind the handle (in shadow), leaving frame
  const sk=o.skin||'#5a3f33', hw=DEV.W/2;
  g.beginPath();g.moveTo(-hw-2,-50);g.bezierCurveTo(-hw-16,-30,-hw-18,10,-hw-30,70);g.lineTo(hw+34,70);g.bezierCurveTo(hw+22,20,hw+14,-20,hw+3,-46);g.closePath();
  const pg=g.createLinearGradient(-hw-20,0,hw+30,0);pg.addColorStop(0,mix(sk,'#000000',.45));pg.addColorStop(.6,mix(sk,'#000000',.75));pg.addColorStop(1,mix(sk,'#000000',.92));
  g.fillStyle=pg;g.fill();
}
function drawHandFront(g,o){
  // two fingertips wrapping round the green handle
  const sk=o.skin||'#5a3f33', hw=DEV.W/2;
  [[-30,8],[-40,7.5]].forEach(([y,h])=>{
    g.beginPath();g.moveTo(hw+3,y-h/2);g.lineTo(-hw*.15,y-h/2);g.arc(-hw*.15,y,h/2,-Math.PI/2,Math.PI/2,true);g.lineTo(hw+3,y+h/2);g.closePath();
    const fg=g.createLinearGradient(0,y-h/2,0,y+h/2);fg.addColorStop(0,mix(sk,'#ffffff',.08));fg.addColorStop(.55,sk);fg.addColorStop(1,mix(sk,'#000000',.6));
    g.fillStyle=fg;g.fill();
  });
}

// ---------------------------------------------------------------------------
// MODEL (stylized previz plates — to be replaced by live-action/AI plates)
// ---------------------------------------------------------------------------
const PROFILE=[[520,330],[430,420],[380,520],[360,620],[352,690],[318,770],[288,835],[300,860],[346,880],[338,920],[352,950],[344,972],[348,1000],[372,1040],[362,1080],[372,1125],[420,1170],[490,1200],[500,1350],[492,1560],[470,1920],[980,1920],[930,1560],[880,1180],[860,1060]];
const JAW_DOWN=[[612,850],[640,960],[660,1050],[610,1120],[520,1160],[452,1166]]; // cheek -> jaw contour
const JAW_UP=[[430,1160],[520,1158],[612,1120],[664,1050],[690,960],[712,880]];   // chin -> along jaw to ear
function pathPts(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;g.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}const l=pts[pts.length-1];g.lineTo(l[0],l[1]);}
function polyAt(pts,u){u=clamp(u);const lens=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);lens.push(d);tot+=d;}
  let k=u*tot;for(let i=0;i<lens.length;i++){if(k<=lens[i]||i===lens.length-1){const f=clamp(k/lens[i]);const a=pts[i],b=pts[i+1];return {x:lerp(a[0],b[0],f),y:lerp(a[1],b[1],f),ang:Math.atan2(b[1]-a[1],b[0]-a[0])};}k-=lens[i];}}

function drawProfile(g,o){
  const env=o.env, skin='#4a3429';
  // hair mass (sleek, pulled back) — far plane, softly blurred for shallow DOF
  g.save();if(o.dof)g.filter=`blur(${o.dof}px)`;
  g.beginPath();g.moveTo(500,322);g.bezierCurveTo(640,210,900,240,990,430);g.bezierCurveTo(1060,620,1010,900,930,1100);g.lineTo(840,1090);g.bezierCurveTo(800,900,760,760,700,600);g.bezierCurveTo(640,470,560,400,470,410);g.closePath();
  const hg=g.createLinearGradient(500,250,1000,900);hg.addColorStop(0,'#0b0c0e');hg.addColorStop(.4,'#16181b');hg.addColorStop(1,C.black);g.fillStyle=hg;g.fill();
  g.strokeStyle=hexA(env.rim,.12);g.lineWidth=3;g.stroke();
  g.restore();
  // face + neck
  g.save();pathPts(g,PROFILE);g.closePath();
  const fg=g.createLinearGradient(300,0,950,0);fg.addColorStop(0,mix(skin,'#000',.25));fg.addColorStop(.35,mix(skin,'#000',.45));fg.addColorStop(1,'#0e0a08');
  g.fillStyle=fg;g.fill();g.clip();
  if(env.tint){g.globalAlpha=.5;g.fillStyle=env.tint;g.globalCompositeOperation='multiply';g.fillRect(0,0,W,H);g.globalAlpha=1;g.globalCompositeOperation='source-over';}
  // visible skin texture
  g.globalAlpha=.10;g.globalCompositeOperation='overlay';g.fillStyle=patSkin;g.fillRect(0,0,W,H);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  // ear
  g.beginPath();g.ellipse(770,870,34,62,.15,0,7);g.fillStyle=mix(skin,'#000',.55);g.fill();
  // light ONLY at the head–skin contact point
  if(o.contact&&o.light>0){
    g.globalCompositeOperation='lighter';
    const L=o.lightColor, cx=o.contact.x, cy=o.contact.y, R=o.lightR||240;
    const lg=g.createRadialGradient(cx,cy,0,cx,cy,R);lg.addColorStop(0,hexA(L,.55*o.light));lg.addColorStop(.35,hexA(L,.18*o.light));lg.addColorStop(1,hexA(L,0));
    g.fillStyle=lg;g.fillRect(cx-R,cy-R,2*R,2*R);
    g.globalCompositeOperation='source-over';
  }
  g.restore();
  // contour edge pick-up
  g.save();pathPts(g,PROFILE.slice(0,18));g.strokeStyle=hexA(env.edge||env.rim,o.edge??.10);g.lineWidth=2;g.stroke();g.restore();
  // closed, calm eye + brow

  const lt=t-25, u=eo(seg(lt,-0.05,2)), z=lerp(1,1.12,u);
  ctx.fillStyle=C.black;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(lerp(420,760,u),lerp(900,1000,u));ctx.scale(z,z);ctx.translate(-lerp(420,760,u),-lerp(900,1000,u));
  // calm X of red / blue / green beams behind
  ctx.save();ctx.globalCompositeOperation='lighter';
  [[C.line,-.62,.5],[C.wave,.62,.5],[C.green,0,.28]].forEach(([c,a,k])=>{ctx.save();ctx.translate(560,950);ctx.rotate(a);
    const g=ctx.createLinearGradient(-40,0,40,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,hexA(c,k));g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(-40,-1400,80,2800);ctx.fillStyle=hexA(c,k*.9);ctx.fillRect(-1,-1400,2,2800);ctx.restore();});
  ctx.restore();
  drawFront(ctx,{env:ENV.studio});
  drawDevice({x:770,y:1500,s:4.2,env:{rim:C.line,rim2:C.wave,tint:'#000000',tintA:0,key:1},hand:true,leds:[1,1,1],ledColor:C.line});
  ctx.restore();
}

function cut10(t){ // 27–30 ENDING PACKSHOT
  ctx.fillStyle=C.black;ctx.fillRect(0,0,W,H);
  const rise=(t0)=>{const p=eo(seg(t,t0,t0+.6));return {a:p,dy:(1-p)*30};};
  const base=1190;
  // thin green reflection line
  const r2=rise(27.35);
  ctx.save();ctx.globalAlpha=r2.a;ctx.globalCompositeOperation='lighter';
  const lg=ctx.createLinearGradient(140,0,940,0);lg.addColorStop(0,'rgba(143,224,42,0)');lg.addColorStop(.5,hexA(C.green,.9));lg.addColorStop(1,'rgba(143,224,42,0)');
  ctx.fillStyle=lg;ctx.fillRect(140,base,800,2);ctx.restore();
  // device + package
  ctx.save();ctx.globalAlpha=r2.a;ctx.translate(0,r2.dy);
  drawDevice({x:390,y:base,s:3.3,env:ENV.studio,reflect:.22,leds:[0,0,0]});
  drawBox(560,base,250,470);
  ctx.restore();
  // logo (placeholder — composite THE iLLON's real duflow logo asset in the edit)
  let r=rise(27.15);ctx.save();ctx.globalAlpha=r.a;ctx.translate(0,r.dy);
  ctx.font='800 40px Syne';ctx.letterSpacing='3px';ctx.textAlign='center';ctx.fillStyle='#d9dcdf';ctx.fillText('duflow',540,380);ctx.restore();
  r=rise(27.75);ctx.save();ctx.globalAlpha=r.a;ctx.translate(0,r.dy);
  ctx.font='800 150px Syne';ctx.letterSpacing='6px';ctx.textAlign='center';ctx.fillStyle='#F2F3F4';ctx.fillText('DURIT',540,560);ctx.restore();
  r=rise(28.10);ctx.save();ctx.globalAlpha=r.a;ctx.translate(0,r.dy);
  ctx.font='600 32px NotoKR';ctx.letterSpacing='9px';ctx.textAlign='center';ctx.fillStyle=C.gold;ctx.fillText('YOUR SKIN COACH',540,632);ctx.restore();
  r=rise(28.45);ctx.save();ctx.globalAlpha=r.a;ctx.translate(0,r.dy);
  ctx.font='600 28px NotoKR';ctx.letterSpacing='6px';ctx.textAlign='center';ctx.fillStyle='#c9cdd1';
  const txt='2025 RED DOT DESIGN AWARD';const w=ctx.measureText(txt).width;ctx.fillText(txt,540+20,1268);
  ctx.beginPath();ctx.arc(540-w/2-14,1258,11,0,7);ctx.fillStyle='#E3001B';ctx.fill();ctx.restore();
}
function drawBox(x,base,w,h){
  const d=60, top=base-h;
  // side face (green edge strip)
  ctx.beginPath();ctx.moveTo(x+w,top);ctx.lineTo(x+w+d,top-d*.45);ctx.lineTo(x+w+d,base-d*.45);ctx.lineTo(x+w,base);ctx.closePath();
  ctx.fillStyle='#17191b';ctx.fill();
  ctx.fillStyle=C.green;ctx.beginPath();ctx.moveTo(x+w,top+h*.0);ctx.lineTo(x+w+10,top-4.5);ctx.lineTo(x+w+10,base-4.5);ctx.lineTo(x+w,base);ctx.closePath();ctx.fill();
  // top
  ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x+d,top-d*.45);ctx.lineTo(x+w+d,top-d*.45);ctx.lineTo(x+w,top);ctx.closePath();ctx.fillStyle='#2a2d30';ctx.fill();
  // front
  const fg=ctx.createLinearGradient(x,0,x+w,0);fg.addColorStop(0,'#2b2e31');fg.addColorStop(.5,'#232629');fg.addColorStop(1,'#1b1d20');
  ctx.fillStyle=fg;ctx.fillRect(x,top,w,h);
  ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation='overlay';ctx.fillStyle=patFine;ctx.fillRect(x,top,w,h);ctx.restore();
  // gold head emblem
  drawHeadFace(ctx,x+w/2,top+h*.42,58,58,{});
  ctx.textAlign='center';ctx.fillStyle='#cfd2d5';ctx.font='800 20px Syne';ctx.letterSpacing='2px';ctx.fillText('duflow',x+w/2,top+46);
  ctx.font='800 40px Syne';ctx.letterSpacing='3px';ctx.fillText('DURIT',x+w/2,top+h*.78);
  // reflection line glow
  ctx.fillStyle=hexA(C.green,.25);ctx.fillRect(x,base-2,w,2);
}

// ---------------------------------------------------------------------------
const CUTS=[[0,3,cut1],[3,6,cut2],[6,8,cut3],[8,10,cut4],[10,15,cut5],[15,17,cut6],[17,22,cut7],[22,25,cut8],[25,27,cut9],[27,30.01,cut10]];
function render(t){
  if(!patFine){patFine=ctx.createPattern(noiseFine,'repeat');patSkin=ctx.createPattern(noiseSkin,'repeat');}
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';ctx.letterSpacing='0px';
  for(const [a,b,f] of CUTS){if(t>=a&&t<b){f(t);break;}}
}
window.render=render;
window.ready=Promise.all([document.fonts.load('800 40px Syne'),document.fonts.load('700 40px NotoKR'),document.fonts.load('600 40px NotoKR')]).then(()=>true);
const q=new URLSearchParams(location.search);if(q.has('t'))window.ready.then(()=>render(parseFloat(q.get('t'))));
</script></body></html>
